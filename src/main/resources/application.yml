spring:
  application:
    name: userCenter1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yyy
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

server:
  port: 8080
  # session 失效时间
  servlet:
    session:
      timeout: 86400
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名(deleted为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0
